# 推送 v* tag 时自动构建并发布 Windows 安装包
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 也允许手动触发

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NiuMaBooster ${{ github.ref_name }}"
          releaseBody: "Windows 安装包，下载 NiuMaBooster_x.x.x_x64-setup.exe 双击安装。详见 README。"
          releaseDraft: false
          prerelease: false
