[package]
name = "niuma-booster"
version = "1.0.0"
description = "牛马鼓励器 - 实时计薪悬浮窗桌面小工具"
edition = "2021"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/niuma-booster"
readme = "../README.md"

[lib]
name = "niuma_booster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
